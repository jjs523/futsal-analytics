[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "futsal-analytics"
version = "0.1.0"
description = "Two-phone futsal player tracking: court geometry, homography, camera fusion, metrics, simulator and server"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "scipy>=1.11",          # tracker v2: Hungarian, Savitzky-Golay, the closed-set MILP (scipy.optimize.milp)
]

[project.optional-dependencies]
sim = ["matplotlib>=3.7", "koreanize-matplotlib>=0.1"]
server = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
vision = ["ultralytics>=8.3"]
# ReID embeddings for tracker v2 (pipeline/reid.py): boxmot itself is NOT listed because its pins (numpy==1.26.4,
# opencv-python<5, torchvision<0.18) do not install on Python 3.14. After this extra: pip install --no-deps boxmot
reid = ["torch>=2.2", "torchvision>=0.17", "filterpy>=1.4.5", "ftfy>=6.1", "gdown>=5.1",
        "lap>=0.5", "loguru>=0.7", "pandas>=2.0", "pyyaml>=6.0", "regex>=2024.0", "scikit-learn>=1.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["futsal*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
