[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "futsal-analytics"
version = "0.1.0"
description = "Two-phone futsal player tracking: court geometry, homography, camera fusion, metrics, simulator and server"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
sim = ["matplotlib>=3.7", "koreanize-matplotlib>=0.1"]
server = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
vision = ["ultralytics>=8.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["futsal*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
